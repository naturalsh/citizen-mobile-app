<!doctype html>
<!-- 112 Emergency Voice Agent — mobile text-chat interface with automatic spoken readout (Web Speech API).
     Zero inline scripts or inline styles (strict CSP). -->
<html lang="en" class="ios">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="112 · Nature Shield">
<meta name="format-detection" content="telephone=yes">
<meta name="robots" content="noindex">
<title>112 Voice Agent · Nature Shield</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="vendor/framework7.min.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="voice.css">
</head>
<body>
<div class="app voice-app">
    <header class="top voice-top">
        <a id="voice-back" class="round" href="./" aria-label="Back to map"><span class="ico ico-back" aria-hidden="true"></span></a>
        <div class="voice-title-box">
            <h1 id="voice-title">112 Assistant</h1>
            <span id="voice-sub" class="area">Automated 112 · Voice readout on</span>
        </div>
        <button id="voice-sound" class="round sound-btn" type="button" aria-label="Mute voice readout" aria-pressed="true"><span class="ico ico-volume" aria-hidden="true"></span></button>
        <button id="view-toggle" class="round view-toggle" type="button" aria-label="Mobile view" aria-pressed="false"><span class="ico ico-phone" aria-hidden="true"></span></button>
        <a id="voice-dial" class="button button-fill call voice-dial" href="tel:112" aria-label="Dial 112">112</a>
    </header>

    <div id="voice-meta" class="voice-meta" hidden></div>

    <main id="chat-scroll" class="chat-scroll">
        <div id="chat-log" class="chat-log" role="log" aria-live="polite"></div>
    </main>

    <form id="composer" class="composer" autocomplete="off">
        <button id="voice-mic" class="composer-icon" type="button" aria-label="Speak your message" hidden><span class="ico ico-mic" aria-hidden="true"></span></button>
        <textarea id="chat-input" class="chat-input" rows="1" placeholder="Type your emergency…" enterkeyhint="send"></textarea>
        <button id="chat-send" class="composer-send" type="submit" aria-label="Send" disabled><span class="ico ico-send" aria-hidden="true"></span></button>
    </form>
</div>

<script type="module" src="voice.js"></script>
</body>
</html>
